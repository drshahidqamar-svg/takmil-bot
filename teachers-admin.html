<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAKMIL — Teacher Phones</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#2563eb;--blue3:#1d4ed8;--green:#059669;--red:#dc2626;--bg:#eff6ff;--border:#bfdbfe;--text:#1e3a5f;--text2:#334155;--text3:#64748b}
html,body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;font-size:14px}
.hdr{background:var(--blue3);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between}
.hdr-left{display:flex;align-items:center;gap:10px;color:#fff}
.hdr-logo{font-weight:800;font-size:15px}
.hdr-title{font-size:11px;font-weight:700;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:1.5px}
.hdr-right a{color:#fff;text-decoration:none;font-size:12px;font-weight:700;background:rgba(255,255,255,.18);padding:6px 14px;border-radius:20px;margin-left:8px}
.body{padding:22px 24px;max-width:1100px;margin:0 auto}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.search{flex:1;max-width:360px;padding:9px 14px;border:1.5px solid var(--border);border-radius:20px;font-size:13px;font-family:inherit;background:#fff}
.btn{padding:9px 18px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid transparent;font-family:inherit}
.btn-primary{background:var(--blue);color:#fff}
.section{background:#fff;border:1.5px solid var(--border);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{text-align:left;padding:10px 14px;background:#eff6ff;border-bottom:2px solid var(--border);font-size:10px;font-weight:700;text-transform:uppercase;color:var(--blue)}
tbody td{padding:9px 14px;border-bottom:1px solid #e0f0ff}
.phone{font-family:'DM Mono',monospace;font-size:12px}
.phone.empty{color:var(--red);font-style:italic}
.icon-btn{padding:5px 10px;border-radius:8px;border:1.5px solid var(--border);background:#fff;cursor:pointer;font-size:11px}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:100}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;width:420px;max-width:92vw}
.modal-hdr{padding:16px 20px;border-bottom:1.5px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:800}
.modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.field label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;display:block;margin-bottom:5px}
.field input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit}
.modal-footer{padding:14px 20px;border-top:1.5px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.modal-error{background:#fef2f2;border:1.5px solid #fecaca;color:#b91c1c;border-radius:8px;padding:8px 12px;font-size:12px;display:none}
.hint{font-size:11px;color:var(--text3);margin-top:-4px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:20px;font-size:12.5px;display:none;z-index:200}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <span class="hdr-logo">TAKMIL</span>
    <span style="opacity:.4">/</span>
    <span class="hdr-title">Teacher Phones</span>
  </div>
  <div class="hdr-right">
    <a href="/admin-users">Users</a>
    <a href="/hub">⌂ Hub</a>
  </div>
</div>

<div class="body">
  <div class="toolbar">
    <input class="search" id="search" placeholder="Search by school name or identifier..." oninput="renderTable()">
    <div style="font-size:12.5px;color:var(--text3)" id="count">Loading...</div>
  </div>
  <div class="section">
    <table>
      <thead><tr><th>School</th><th>Identifier</th><th>Region</th><th>Teacher Phone</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="5" style="padding:30px;text-align:center;color:var(--text3)">Loading...</td></tr></tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-hdr"><span id="modal-title">Update Teacher Phone</span><button onclick="closeModal()" style="background:none;border:none;font-size:18px;cursor:pointer">✕</button></div>
    <div class="modal-body">
      <div class="modal-error" id="modal-error"></div>
      <div style="font-size:13px;color:var(--text2)" id="school-name"></div>
      <div class="field">
        <label>Teacher Phone *</label>
        <input type="text" id="f-phone" placeholder="+923001234567">
        <div class="hint">International format, must start with + (e.g. +923001234567)</div>
      </div>
      <div class="field">
        <label>Contact Name (optional)</label>
        <input type="text" id="f-contact">
      </div>
    </div>
    <div class="modal-footer">
      <button class="icon-btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTeacherPhone()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let schools = [];
let editingId = null;

async function api(path, opts) {
  const res = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts || {}));
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

async function loadSchools() {
  try {
    schools = await api('/admin/schools/list');
    renderTable();
  } catch(e) {
    document.getElementById('rows').innerHTML =
      `<tr><td colspan="5" style="padding:30px;text-align:center;color:var(--red)">Failed to load: ${e.message}</td></tr>`;
  }
}

function renderTable() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filtered = !q ? schools : schools.filter(s =>
    (s.name || '').toLowerCase().includes(q) || (s.identifier || '').toLowerCase().includes(q)
  );
  document.getElementById('count').textContent = filtered.length + ' school' + (filtered.length !== 1 ? 's' : '');
  const body = document.getElementById('rows');
  if (!filtered.length) {
    body.innerHTML = '<tr><td colspan="5" style="padding:30px;text-align:center;color:var(--text3)">No matching schools.</td></tr>';
    return;
  }
  body.innerHTML = filtered.map(s => `
    <tr>
      <td style="font-weight:700">${s.name || ''}</td>
      <td style="color:var(--text3);font-family:'DM Mono',monospace;font-size:11px">${s.identifier || '—'}</td>
      <td style="color:var(--text3)">${s.region || '—'}</td>
      <td><span class="phone ${!s.teacher_phone ? 'empty' : ''}">${s.teacher_phone || 'Not set'}</span></td>
      <td><button class="icon-btn" onclick='openEdit(${JSON.stringify(s).replace(/'/g, "&apos;")})'>Edit</button></td>
    </tr>`).join('');
}

function openEdit(s) {
  editingId = s.id;
  document.getElementById('school-name').textContent = s.name + (s.identifier ? ' (' + s.identifier + ')' : '');
  document.getElementById('f-phone').value = s.teacher_phone || '';
  document.getElementById('f-contact').value = s.contact_name || '';
  document.getElementById('modal-error').style.display = 'none';
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

async function saveTeacherPhone() {
  const phone = document.getElementById('f-phone').value.trim();
  const contact_name = document.getElementById('f-contact').value.trim();
  const errEl = document.getElementById('modal-error');
  errEl.style.display = 'none';

  if (!phone) { errEl.textContent = 'Phone number is required.'; errEl.style.display = 'block'; return; }
  if (!/^\+\d{10,15}$/.test(phone)) {
    errEl.textContent = 'Phone must be international format, e.g. +923001234567';
    errEl.style.display = 'block';
    return;
  }

  try {
    const updated = await api('/admin/schools/' + editingId + '/teacher-phone', {
      method: 'PUT',
      body: JSON.stringify({ teacher_phone: phone, contact_name: contact_name || null })
    });
    const idx = schools.findIndex(s => s.id === editingId);
    if (idx > -1) schools[idx] = Object.assign(schools[idx], updated);
    closeModal();
    renderTable();
    showToast('Saved — teacher phone updated.');
  } catch(e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

loadSchools();
</script>
</body>
</html>
