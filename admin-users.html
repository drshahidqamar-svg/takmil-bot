<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAKMIL — User Management</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#2563eb;--blue3:#1d4ed8;--green:#059669;--red:#dc2626;--bg:#eff6ff;--border:#bfdbfe;--text:#1e3a5f;--text2:#334155;--text3:#64748b}
html,body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;font-size:14px}
.hdr{background:var(--blue3);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between}
.hdr-left{display:flex;align-items:center;gap:10px;color:#fff}
.hdr-logo{font-weight:800;font-size:15px}
.hdr-title{font-size:11px;font-weight:700;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:1.5px}
.hdr-right a{color:#fff;text-decoration:none;font-size:12px;font-weight:700;background:rgba(255,255,255,.18);padding:6px 14px;border-radius:20px}
.body{padding:22px 24px;max-width:1100px;margin:0 auto}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.btn{padding:9px 18px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid transparent;font-family:inherit}
.btn-primary{background:var(--blue);color:#fff}
.section{background:#fff;border:1.5px solid var(--border);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{text-align:left;padding:10px 14px;background:#eff6ff;border-bottom:2px solid var(--border);font-size:10px;font-weight:700;text-transform:uppercase;color:var(--blue)}
tbody td{padding:9px 14px;border-bottom:1px solid #e0f0ff}
.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px}
.badge-admin{background:#ede9fe;color:#5b21b6}
.badge-rc{background:#dbeafe;color:#1d4ed8}
.badge-coord{background:#dcfce7;color:#15803d}
.badge-active{background:#dcfce7;color:#15803d}
.badge-inactive{background:#f1f5f9;color:#64748b}
.icon-btn{padding:5px 10px;border-radius:8px;border:1.5px solid var(--border);background:#fff;cursor:pointer;font-size:11px;margin-right:4px}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:100}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;width:420px;max-width:92vw}
.modal-hdr{padding:16px 20px;border-bottom:1.5px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:800}
.modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.field label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;display:block;margin-bottom:5px}
.field input,.field select{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit}
.modal-footer{padding:14px 20px;border-top:1.5px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.modal-error{background:#fef2f2;border:1.5px solid #fecaca;color:#b91c1c;border-radius:8px;padding:8px 12px;font-size:12px;display:none}
.hint{font-size:11px;color:var(--text3);margin-top:-4px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <span class="hdr-logo">TAKMIL</span>
    <span style="opacity:.4">/</span>
    <span class="hdr-title">User Management</span>
  </div>
  <div class="hdr-right"><a href="/hub">⌂ Hub</a></div>
</div>

<div class="body">
  <div class="toolbar">
    <div style="font-size:13px;color:var(--text3)" id="user-count">Loading...</div>
    <button class="btn btn-primary" onclick="openAdd()">+ Add User</button>
  </div>
  <div class="section">
    <table>
      <thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Linked To</th><th>Status</th><th>Last Login</th><th></th></tr></thead>
      <tbody id="users-body"><tr><td colspan="7" style="padding:30px;text-align:center;color:var(--text3)">Loading...</td></tr></tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-hdr"><span id="modal-title">Add User</span><button onclick="closeModal()" style="background:none;border:none;font-size:18px;cursor:pointer">✕</button></div>
    <div class="modal-body">
      <div class="modal-error" id="modal-error"></div>
      <input type="hidden" id="f-id">
      <div class="field"><label>Full Name *</label><input type="text" id="f-name"></div>
      <div class="field"><label>Username *</label><input type="text" id="f-username"></div>
      <div class="field">
        <label id="pw-label">Password *</label>
        <input type="password" id="f-password">
        <div class="hint" id="pw-hint" style="display:none">Leave blank to keep current password</div>
      </div>
      <div class="field">
        <label>Role *</label>
        <select id="f-role" onchange="onRoleChange()">
          <option value="admin">Admin / Ops (full access)</option>
          <option value="regional_coordinator">Regional Coordinator</option>
          <option value="coordinator">Coordinator / Teacher</option>
        </select>
      </div>
      <div class="field" id="linked-name-wrap" style="display:none">
        <label id="linked-name-label">Linked Regional Coordinator *</label>
        <select id="f-linked-name"></select>
        <div class="hint">Must match their name in the student roster, so their access is scoped correctly.</div>
      </div>
      <div class="field" id="active-wrap" style="display:none">
        <label>Status</label>
        <select id="f-active"><option value="true">Active</option><option value="false">Inactive</option></select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="icon-btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveUser()">Save</button>
    </div>
  </div>
</div>

<script>
let editingId = null;
let rosterNames = { regionalCoordinators: [], coordinators: [] };

async function api(path, opts) {
  const res = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts || {}));
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

async function loadRosterNames() {
  try {
    rosterNames = await api('/api/admin/roster-names');
  } catch(e) { console.error(e); }
}

async function loadUsers() {
  const body = document.getElementById('users-body');
  try {
    const data = await api('/api/admin/users');
    const users = data.users || [];
    document.getElementById('user-count').textContent = users.length + ' user' + (users.length!==1?'s':'');
    if (!users.length) {
      body.innerHTML = '<tr><td colspan="7" style="padding:30px;text-align:center;color:var(--text3)">No users yet — add your first admin account.</td></tr>';
      return;
    }
    const roleBadge = r => r==='admin' ? '<span class="badge badge-admin">Admin</span>'
                       : r==='regional_coordinator' ? '<span class="badge badge-rc">Regional Coordinator</span>'
                       : '<span class="badge badge-coord">Coordinator</span>';
    body.innerHTML = users.map(u => `
      <tr>
        <td style="font-weight:700">${u.name}</td>
        <td style="font-family:'DM Mono',monospace;font-size:11px">${u.username}</td>
        <td>${roleBadge(u.role)}</td>
        <td style="color:var(--text3)">${u.linked_name || '—'}</td>
        <td>${u.active ? '<span class="badge badge-active">Active</span>' : '<span class="badge badge-inactive">Inactive</span>'}</td>
        <td style="color:var(--text3);font-size:11px">${u.last_login ? new Date(u.last_login).toLocaleString() : 'Never'}</td>
        <td>
          <button class="icon-btn" onclick='openEdit(${JSON.stringify(u).replace(/'/g,"&apos;")})'>Edit</button>
          <button class="icon-btn" onclick="deleteUser(${u.id},'${u.name}')">Delete</button>
        </td>
      </tr>`).join('');
  } catch(e) {
    body.innerHTML = `<tr><td colspan="7" style="padding:30px;text-align:center;color:var(--red)">Failed to load: ${e.message}</td></tr>`;
  }
}

function onRoleChange() {
  const role = document.getElementById('f-role').value;
  const wrap = document.getElementById('linked-name-wrap');
  const sel = document.getElementById('f-linked-name');
  const label = document.getElementById('linked-name-label');
  if (role === 'admin') {
    wrap.style.display = 'none';
    return;
  }
  wrap.style.display = 'block';
  const isRC = role === 'regional_coordinator';
  label.textContent = isRC ? 'Linked Regional Coordinator *' : 'Linked Coordinator *';
  const names = isRC ? rosterNames.regionalCoordinators : rosterNames.coordinators;
  sel.innerHTML = '<option value="">-- Select --</option>' + names.map(n => `<option value="${n}">${n}</option>`).join('');
}

function openAdd() {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Add User';
  document.getElementById('f-id').value = '';
  document.getElementById('f-name').value = '';
  document.getElementById('f-username').value = '';
  document.getElementById('f-password').value = '';
  document.getElementById('pw-label').textContent = 'Password *';
  document.getElementById('pw-hint').style.display = 'none';
  document.getElementById('f-role').value = 'admin';
  document.getElementById('active-wrap').style.display = 'none';
  document.getElementById('modal-error').style.display = 'none';
  onRoleChange();
  document.getElementById('modal').classList.add('open');
}

function openEdit(u) {
  editingId = u.id;
  document.getElementById('modal-title').textContent = 'Edit User';
  document.getElementById('f-id').value = u.id;
  document.getElementById('f-name').value = u.name;
  document.getElementById('f-username').value = u.username;
  document.getElementById('f-password').value = '';
  document.getElementById('pw-label').textContent = 'Password';
  document.getElementById('pw-hint').style.display = 'block';
  document.getElementById('f-role').value = u.role;
  document.getElementById('active-wrap').style.display = 'block';
  document.getElementById('f-active').value = String(u.active);
  document.getElementById('modal-error').style.display = 'none';
  onRoleChange();
  document.getElementById('f-linked-name').value = u.linked_name || '';
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

async function saveUser() {
  const name = document.getElementById('f-name').value.trim();
  const username = document.getElementById('f-username').value.trim();
  const password = document.getElementById('f-password').value;
  const role = document.getElementById('f-role').value;
  const linked_name = document.getElementById('f-linked-name').value || null;
  const errEl = document.getElementById('modal-error');
  errEl.style.display = 'none';

  if (!name || !username) { errEl.textContent = 'Name and username are required.'; errEl.style.display='block'; return; }
  if (!editingId && !password) { errEl.textContent = 'Password is required for a new user.'; errEl.style.display='block'; return; }
  if (role !== 'admin' && !linked_name) { errEl.textContent = 'Please select who this account is linked to.'; errEl.style.display='block'; return; }

  try {
    if (editingId) {
      const body = { name, role, linked_name, active: document.getElementById('f-active').value === 'true' };
      if (password) body.password = password;
      await api('/api/admin/users/' + editingId, { method: 'PUT', body: JSON.stringify(body) });
    } else {
      await api('/api/admin/users', { method: 'POST', body: JSON.stringify({ name, username, password, role, linked_name }) });
    }
    closeModal();
    await loadUsers();
  } catch(e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

async function deleteUser(id, name) {
  if (!confirm(`Delete user "${name}"? This cannot be undone.`)) return;
  try {
    await api('/api/admin/users/' + id, { method: 'DELETE' });
    await loadUsers();
  } catch(e) { alert('Error: ' + e.message); }
}

(async function init() {
  await loadRosterNames();
  await loadUsers();
})();
</script>
</body>
</html>
