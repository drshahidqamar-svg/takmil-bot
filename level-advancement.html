<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAKMIL — Level Advancement Console</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f8;min-height:100vh}
.header{background:linear-gradient(135deg,#1a2e44,#2d4a6e);color:white;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
.logo{font-size:20px;font-weight:800;color:#4ade80}
.header-sub{font-size:12px;color:rgba(255,255,255,0.6);margin-top:2px}
.container{max-width:1200px;margin:0 auto;padding:24px 16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
@media(max-width:640px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:white;border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,0.06);text-align:center}
.stat-num{font-size:32px;font-weight:800;color:#1a2e44}
.stat-lbl{font-size:11px;color:#64748b;font-weight:700;text-transform:uppercase;margin-top:4px}
.filters{background:white;border-radius:12px;padding:16px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.06);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{padding:8px 14px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;font-family:inherit;outline:none}
.filters select:focus,.filters input:focus{border-color:#01796F}
.filter-label{font-size:13px;font-weight:600;color:#64748b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.school-card{background:white;border-radius:14px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,0.08);border-left:4px solid #e2e8f0;transition:all 0.2s}
.school-card:hover{box-shadow:0 4px 20px rgba(0,0,0,0.12);transform:translateY(-1px)}
.school-card.graduated{border-left-color:#4ade80}
.school-card.advanced{border-left-color:#01796F}
.school-name{font-size:15px;font-weight:700;color:#1a2e44;margin-bottom:2px}
.school-meta{font-size:12px;color:#64748b;margin-bottom:14px}
.level-display{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.level-badge{background:#1a2e44;color:white;border-radius:8px;padding:6px 14px;font-size:18px;font-weight:800}
.level-badge.grand{background:linear-gradient(135deg,#f59e0b,#d97706)}
.level-progress{flex:1;height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden}
.level-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#01796F,#4ade80);transition:width 0.5s}
.level-pct{font-size:12px;color:#64748b;font-weight:600}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.score-box{background:#f8fafc;border-radius:8px;padding:8px;text-align:center}
.score-subj{font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:2px}
.score-val{font-size:18px;font-weight:800}
.score-val.good{color:#16a34a}
.score-val.ok{color:#d97706}
.score-val.low{color:#dc2626}
.score-val.none{color:#94a3b8}
.students-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:13px}
.students-count{font-weight:600;color:#1a2e44}
.att-rate{color:#64748b}
.btn-advance{width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,#01796F,#019587);color:white;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.2s;box-shadow:0 3px 10px rgba(1,121,111,0.3)}
.btn-advance:hover{opacity:0.9;transform:translateY(-1px)}
.btn-advance:disabled{background:#9ca3af;box-shadow:none;cursor:not-allowed;transform:none}
.btn-grand{background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 3px 10px rgba(245,158,11,0.3)}
.btn-graduated{background:linear-gradient(135deg,#4ade80,#16a34a);cursor:default}
.history-btn{width:100%;padding:8px;border-radius:8px;border:1px solid #e2e8f0;background:white;color:#64748b;font-size:12px;cursor:pointer;font-family:inherit;margin-top:8px}
.history-btn:hover{background:#f8fafc}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:100;display:none}
.modal{background:white;border-radius:16px;padding:28px;width:90%;max-width:480px;max-height:80vh;overflow-y:auto}
.modal-title{font-size:18px;font-weight:700;color:#1a2e44;margin-bottom:16px}
.modal-close{float:right;cursor:pointer;font-size:20px;color:#64748b;background:none;border:none}
.confirm-box{background:#fef3c7;border:2px solid #f59e0b;border-radius:10px;padding:16px;margin-bottom:16px}
.confirm-title{font-weight:700;color:#92400e;margin-bottom:8px}
.confirm-detail{font-size:13px;color:#78350f;line-height:1.6}
.notes-input{width:100%;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;font-family:inherit;margin-bottom:14px;resize:vertical;min-height:70px;outline:none}
.notes-input:focus{border-color:#01796F}
.modal-btns{display:flex;gap:10px}
.btn-confirm{flex:1;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,#01796F,#019587);color:white;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-cancel{padding:12px 20px;border-radius:10px;border:1.5px solid #e2e8f0;background:white;color:#64748b;font-size:15px;cursor:pointer;font-family:inherit}
.history-list{margin-top:12px}
.hist-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
.hist-level{font-weight:700;color:#01796F}
.hist-date{color:#64748b}
.hist-by{color:#94a3b8;font-size:11px}
.loading{text-align:center;padding:60px;color:#94a3b8;font-size:15px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a2e44;color:white;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:600;z-index:200;opacity:0;transition:opacity 0.3s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;padding:60px;color:#94a3b8}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;margin-left:6px}
.tag-sindh{background:#dbeafe;color:#1d4ed8}
.tag-punjab{background:#fce7f3;color:#9d174d}
.tag-kpk{background:#d1fae5;color:#065f46}
.tag-gb{background:#e0e7ff;color:#3730a3}
.tag-baloch{background:#fef3c7;color:#92400e}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="logo">TAKMIL</div>
    <div class="header-sub">Level Advancement Console — Ops Team</div>
  </div>
  <div style="display:flex;gap:12px;align-items:center">
    <select id="f-province" onchange="render()" style="padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);color:white;font-family:inherit;font-size:13px">
      <option value="">All Provinces</option>
      <option value="Sindh">Sindh</option>
      <option value="Punjab">Punjab</option>
      <option value="KPK">KPK</option>
      <option value="GilgitBaltistan">Gilgit Baltistan</option>
      <option value="Balochistan">Balochistan</option>
    </select>
    <button onclick="loadData()" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:white;padding:8px 16px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px">↻ Refresh</button>
  </div>
</div>

<div class="container">
  <!-- Stats -->
  <div class="stats">
    <div class="stat"><div class="stat-num" id="st-total">—</div><div class="stat-lbl">Total Schools</div></div>
    <div class="stat"><div class="stat-num" id="st-students" style="color:#01796F">—</div><div class="stat-lbl">Total Students</div></div>
    <div class="stat"><div class="stat-num" id="st-avg-level" style="color:#d97706">—</div><div class="stat-lbl">Avg Level</div></div>
    <div class="stat"><div class="stat-num" id="st-graduated" style="color:#4ade80">—</div><div class="stat-lbl">Graduated</div></div>
  </div>

  <!-- Search -->
  <div class="filters">
    <span class="filter-label">Search:</span>
    <input type="text" id="f-search" placeholder="School name..." oninput="render()" style="min-width:220px">
    <span class="filter-label">Level:</span>
    <select id="f-level" onchange="render()">
      <option value="">All Levels</option>
      <option value="1">Level 1</option><option value="2">Level 2</option>
      <option value="3">Level 3</option><option value="4">Level 4</option>
      <option value="5">Level 5</option><option value="6">Level 6</option>
      <option value="7">Level 7</option><option value="8">Level 8</option>
      <option value="9">Level 9</option><option value="10">Level 10</option>
      <option value="11">Level 11 (Grand Assessment)</option>
      <option value="12">Graduated</option>
    </select>
  </div>

  <!-- School cards -->
  <div class="grid" id="grid"><div class="loading">Loading schools...</div></div>
</div>

<!-- Confirm Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title" id="modal-title">Advance School Level</div>
    <div class="confirm-box">
      <div class="confirm-title" id="modal-school">—</div>
      <div class="confirm-detail" id="modal-detail">—</div>
    </div>
    <textarea class="notes-input" id="modal-notes" placeholder="Notes (optional) — e.g. All students showed strong SLO mastery in Math and English..."></textarea>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-confirm" id="modal-confirm" onclick="confirmAdvance()">✅ Confirm Advance</button>
    </div>
  </div>
</div>

<!-- History Modal -->
<div class="modal-overlay" id="hist-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeHistModal()">✕</button>
    <div class="modal-title" id="hist-title">Level History</div>
    <div class="history-list" id="hist-list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let allSchools = [];
let pendingAdvance = null;

async function loadData() {
  try {
    const resp = await fetch('/api/console/schools-progress');
    const data = await resp.json();
    allSchools = data.schools || [];
    updateStats();
    render();
  } catch(e) {
    document.getElementById('grid').innerHTML = `<div class="empty">❌ Error loading data: ${e.message}</div>`;
  }
}

function updateStats() {
  document.getElementById('st-total').textContent     = allSchools.length;
  document.getElementById('st-students').textContent  = allSchools.reduce((s,x)=>s+(x.student_count||0),0);
  const avgLevel = allSchools.length
    ? (allSchools.reduce((s,x)=>s+(x.current_level||1),0)/allSchools.length).toFixed(1)
    : '—';
  document.getElementById('st-avg-level').textContent = avgLevel;
  document.getElementById('st-graduated').textContent = allSchools.filter(s=>s.current_level>=12).length;
}

function render() {
  const search   = document.getElementById('f-search').value.toLowerCase();
  const province = document.getElementById('f-province').value;
  const levelF   = document.getElementById('f-level').value;

  let schools = allSchools.filter(s => {
    if (search && !s.name?.toLowerCase().includes(search) && !s.identifier?.toLowerCase().includes(search)) return false;
    if (province && s.province !== province) return false;
    if (levelF && String(s.current_level || 1) !== levelF) return false;
    return true;
  });

  if (!schools.length) {
    document.getElementById('grid').innerHTML = '<div class="empty">No schools match the filter</div>';
    return;
  }

  document.getElementById('grid').innerHTML = schools.map(s => schoolCard(s)).join('');
}

function schoolCard(s) {
  const level    = s.current_level || 1;
  const isGrand  = level === 11;
  const isGrad   = level >= 12;
  const pct      = Math.round((level / 12) * 100);
  const prov     = s.province || '';
  const provTag  = { Sindh:'sindh', Punjab:'punjab', KPK:'kpk', GilgitBaltistan:'gb', Balochistan:'baloch' }[prov] || '';

  const scoreColor = v => !v ? 'none' : v>=80?'good':v>=60?'ok':'low';
  const scoreVal   = v => !v ? '—' : Math.round(v)+'%';

  const btnText = isGrad
    ? '🎓 Graduated'
    : isGrand
    ? '🏆 Mark Grand Assessment Complete'
    : `⬆️ Advance to Level ${level + 1}`;

  const btnClass = isGrad ? 'btn-advance btn-graduated'
    : isGrand ? 'btn-advance btn-grand'
    : 'btn-advance';

  return `<div class="school-card ${isGrad?'graduated':level>1?'advanced':''}">
    <div class="school-name">${s.name || s.identifier}
      <span class="tag tag-${provTag}">${prov}</span>
    </div>
    <div class="school-meta">${s.identifier} · ${s.student_count||0} students · Teacher: ${s.teacher_name||'—'}</div>

    <div class="level-display">
      <div class="level-badge ${isGrand?'grand':''}">${isGrad?'🎓':('L'+level)}</div>
      <div class="level-progress"><div class="level-fill" style="width:${pct}%"></div></div>
      <div class="level-pct">${pct}%</div>
    </div>

    <div class="scores">
      <div class="score-box">
        <div class="score-subj">Math</div>
        <div class="score-val ${scoreColor(s.math_avg)}">${scoreVal(s.math_avg)}</div>
      </div>
      <div class="score-box">
        <div class="score-subj">English</div>
        <div class="score-val ${scoreColor(s.english_avg)}">${scoreVal(s.english_avg)}</div>
      </div>
      <div class="score-box">
        <div class="score-subj">Urdu</div>
        <div class="score-val ${scoreColor(s.urdu_avg)}">${scoreVal(s.urdu_avg)}</div>
      </div>
    </div>

    <div class="students-row">
      <span class="students-count">👥 ${s.student_count||0} students enrolled</span>
      <span class="att-rate">📅 ${s.attendance_rate||'—'}% attendance</span>
    </div>

    <button class="${btnClass}"
      ${isGrad?'disabled':''}
      onclick="openAdvance('${s.identifier}','${(s.name||s.identifier).replace(/'/g,"\\'")}',${level},${s.student_count||0})">
      ${btnText}
    </button>
    <button class="history-btn" onclick="showHistory('${s.identifier}','${(s.name||s.identifier).replace(/'/g,"\\'")}')">
      📋 View Level History
    </button>
  </div>`;
}

function openAdvance(identifier, name, currentLevel, studentCount) {
  const nextLevel = currentLevel + 1;
  pendingAdvance  = { identifier, name, currentLevel, nextLevel, studentCount };

  document.getElementById('modal-title').textContent =
    nextLevel > 11 ? '🏆 Grand Assessment Complete' : `⬆️ Advance to Level ${nextLevel}`;
  document.getElementById('modal-school').textContent = name;
  document.getElementById('modal-detail').innerHTML =
    `Current Level: <strong>Level ${currentLevel}</strong><br>` +
    `Moving to: <strong>${nextLevel > 11 ? '🏆 Grand Assessment / Graduated' : 'Level ' + nextLevel}</strong><br>` +
    `Students affected: <strong>${studentCount}</strong><br><br>` +
    `⚠️ This will advance ALL ${studentCount} students in this school simultaneously.`;
  document.getElementById('modal-notes').value = '';
  document.getElementById('modal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
  pendingAdvance = null;
}

async function confirmAdvance() {
  if (!pendingAdvance) return;
  const btn   = document.getElementById('modal-confirm');
  const notes = document.getElementById('modal-notes').value.trim();

  btn.disabled    = true;
  btn.textContent = '⏳ Saving...';

  try {
    const resp = await fetch('/api/console/advance-level', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        school_identifier: pendingAdvance.identifier,
        from_level:        pendingAdvance.currentLevel,
        to_level:          pendingAdvance.nextLevel,
        student_count:     pendingAdvance.studentCount,
        notes,
        advanced_by:       'Ops Team',
      })
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Failed');

    closeModal();
    showToast(`✅ ${pendingAdvance.name} advanced to Level ${pendingAdvance.nextLevel}`);
    await loadData();
  } catch(e) {
    showToast('❌ Error: ' + e.message);
  } finally {
    btn.disabled    = false;
    btn.textContent = '✅ Confirm Advance';
  }
}

async function showHistory(identifier, name) {
  document.getElementById('hist-title').textContent  = `Level History — ${name}`;
  document.getElementById('hist-list').innerHTML      = '<div style="color:#94a3b8;padding:20px 0">Loading...</div>';
  document.getElementById('hist-modal').style.display = 'flex';

  try {
    const resp = await fetch(`/api/console/level-history?school=${encodeURIComponent(identifier)}`);
    const data = await resp.json();
    const history = data.history || [];

    if (!history.length) {
      document.getElementById('hist-list').innerHTML =
        '<div style="color:#94a3b8;padding:20px 0;text-align:center">No level advances recorded yet</div>';
      return;
    }

    document.getElementById('hist-list').innerHTML = history.map(h => `
      <div class="hist-item">
        <div>
          <div class="hist-level">L${h.from_level} → L${h.to_level}</div>
          <div class="hist-by">By: ${h.advanced_by || 'Ops Team'} ${h.notes ? '· ' + h.notes : ''}</div>
        </div>
        <div class="hist-date">${new Date(h.advanced_at).toLocaleDateString('en-PK',{month:'short',day:'numeric',year:'numeric'})}</div>
      </div>`).join('');
  } catch(e) {
    document.getElementById('hist-list').innerHTML = '<div style="color:#dc2626">Error loading history</div>';
  }
}

function closeHistModal() {
  document.getElementById('hist-modal').style.display = 'none';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

loadData();
setInterval(loadData, 120000);
</script>
</body>
</html>
